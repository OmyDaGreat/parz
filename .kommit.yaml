types:
  - feat: A new feature
  - fix: A bug fix
  - docs: Documentation only changes
  - refactor: A code change that deals with style, structure, or organization of code
  - chore: Changes dealing with configuration and other non-code files
  - ci: Changes to CI configuration files and scripts (GitHub Actions)
  - test: Adding missing tests or correcting existing tests

scopes:
  all:
    - core
    - idl
    - tooling
  chore:
    - deps
    - gradle
    - license
    - actions
  docs:
    - readme

options:
  stageMode: review
  autoPush: true
  allowBreakingChanges: false # Stability isn't important rn
  allowIssues: false # Not set up yet
  allowCustomScopes: false # Just add a scope
  allowEmptyScopes: true # Implies project-wide scope
