name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: 'Custom version (overrides bump)'
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  ci:
    name: Test and Build Native CLI
    uses: ./.github/workflows/gradle.yml

  publish:
    name: Release Build and Publish
    needs: ci
    runs-on: macos-latest
    outputs:
      version: ${{ steps.bump_version.outputs.new_version }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew Executable
        run: chmod +x gradlew

      - name: Install xmllint
        run: brew install libxml2 && brew link --force libxml2

      - name: Bump version in gradle.properties
        id: bump_version
        run: |
          file="gradle.properties"
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
          new_version="${{ github.event.inputs.custom_version }}"
          else
          version_line=$(grep "^version=" "$file" || echo "")
          version=${version_line#version=}
          IFS='.' read -r major minor patch <<< "$version"
          case "${{ github.event.inputs.bump }}" in
          major)
          major=$((major+1)); minor=0; patch=0;;
          minor)
          minor=$((minor+1)); patch=0;;
          patch|*)
          patch=$((patch+1));;
          esac
          new_version="$major.$minor.$patch"
          fi
          sed -i '' "s/^version=.*/version=$new_version/" "$file"
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

      - name: Extract Maven Central credentials from token block
        id: extract-creds
        run: |
          echo "${{ secrets.SONATYPE_TOKEN_XML }}" > server.xml
          USERNAME=$(xmllint --xpath "string(//username)" server.xml)
          PASSWORD=$(xmllint --xpath "string(//password)" server.xml)
          rm server.xml
          echo "::add-mask::$USERNAME"
          echo "::add-mask::$PASSWORD"
          echo "ORG_GRADLE_PROJECT_mavenCentralUsername=$USERNAME" >> $GITHUB_ENV
          echo "ORG_GRADLE_PROJECT_mavenCentralPassword=$PASSWORD" >> $GITHUB_ENV

      - name: Build Java CLI zip
        run: ./gradlew :tooling:cli:distZip

      - name: Download native CLI builds
        uses: actions/download-artifact@v8
        with:
          pattern: parz-*
          path: dist
          merge-multiple: true

      - name: Publish to MavenCentral
        run: ./gradlew publishAllPublicationsToMavenCentralRepository --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Rebase onto latest branch
        run: |
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            pull --rebase --autostash origin "${{ github.ref_name }}"

      - name: Commit and push version bump
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(release): bump version to ${{ steps.bump_version.outputs.new_version }}"
          file_pattern: gradle.properties

      - name: Generate changelog since last tag
        id: changelog
        run: |
          last_tag=$(git describe --tags --abbrev=0 || echo "")
          if [ -z "$last_tag" ]; then
            changelog=$(git log --pretty=format:"* %s" )
          else
            changelog=$(git log "$last_tag"..HEAD --pretty=format:"* %s")
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$changelog" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.bump_version.outputs.new_version }}
          name: v${{ steps.bump_version.outputs.new_version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            dist/*
            tooling/cli/build/distributions/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-managers:
    name: Update Homebrew Tap and Scoop Bucket
    needs: publish
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.publish.outputs.version }}
      TAG: v${{ needs.publish.outputs.version }}
      RELEASES: https://github.com/OmyDaGreat/parz/releases/download/v${{ needs.publish.outputs.version }}
      REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
    steps:
      - name: Check for repository token
        id: token
        run: |
          if [ -z "$REPO_ACCESS_TOKEN" ]; then
            echo "::warning::REPO_ACCESS_TOKEN is not set; skipping Homebrew and Scoop updates."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download native CLI builds
        if: steps.token.outputs.present == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: parz-*
          path: dist
          merge-multiple: true

      - name: Calculate SHA256 checksums
        if: steps.token.outputs.present == 'true'
        id: sha
        working-directory: dist
        run: |
          echo "linux_x64=$(sha256sum parz-linux-x64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(sha256sum parz-linux-arm64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "macos_arm64=$(sha256sum parz-macos-arm64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "windows_x64=$(sha256sum parz-windows-x64.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        if: steps.token.outputs.present == 'true'
        run: |
          git clone "https://x-access-token:${REPO_ACCESS_TOKEN}@github.com/OmyDaGreat/homebrew-malefic.git"
          cd homebrew-malefic
          mkdir -p Formula
          cat > Formula/parz.rb << EOF
          class Parz < Formula
            desc "Shared IR and IDL for programming languages, with a schema REPL"
            homepage "https://github.com/OmyDaGreat/parz"
            version "${VERSION}"
            license "AGPL-3.0-only"

            on_macos do
              on_arm do
                url "${RELEASES}/parz-macos-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.macos_arm64 }}"
              end
            end

            on_linux do
              on_intel do
                url "${RELEASES}/parz-linux-x64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_x64 }}"
              end
              on_arm do
                url "${RELEASES}/parz-linux-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_arm64 }}"
              end
            end

            def install
              bin.install "parz"
            end

            test do
              assert_match "Status", pipe_output(bin/"parz", "enum Status { pending, settled };;")
            end
          end
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/parz.rb
          git commit -m "parz: update to ${VERSION}"
          git push

      - name: Update Scoop manifest
        if: steps.token.outputs.present == 'true'
        run: |
          git clone "https://x-access-token:${REPO_ACCESS_TOKEN}@github.com/OmyDaGreat/MaleficBucket.git"
          cd MaleficBucket
          mkdir -p bucket
          cat > bucket/parz.json << EOF
          {
              "version": "${VERSION}",
              "description": "Shared IR and IDL for programming languages, with a schema REPL",
              "homepage": "https://github.com/OmyDaGreat/parz",
              "license": "AGPL-3.0-only",
              "architecture": {
                  "64bit": {
                      "url": "${RELEASES}/parz-windows-x64.zip",
                      "hash": "${{ steps.sha.outputs.windows_x64 }}"
                  }
              },
              "bin": "parz.exe",
              "checkver": "github",
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/OmyDaGreat/parz/releases/download/v\$version/parz-windows-x64.zip"
                      }
                  }
              }
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/parz.json
          git commit -m "parz: update to ${VERSION}"
          git push
