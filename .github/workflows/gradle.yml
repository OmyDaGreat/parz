name: Java CI with Gradle

on:
  push:
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: iosSimulatorArm64Test
            os: macos-latest
          - target: jvmTest
            os: ubuntu-latest
          - target: jsNodeTest
            os: ubuntu-latest
          - target: testAndroid
            os: ubuntu-latest
          - target: :tooling:cli:check :tooling:cli:distZip
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v6

    - uses: actions/cache@v6
      with:
        path: |
          ~/.konan
        key: ${{ runner.os }}-${{ hashFiles('**/.lock') }}

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Build with Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Run matrix target
      run: ./gradlew ${{ matrix.target }}

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            native: linux-x64
          - os: ubuntu-24.04-arm
            native: linux-arm64
          - os: macos-latest
            native: macos-arm64
          - os: windows-latest
            native: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7

    - name: Set up GraalVM 25
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '25'
        distribution: 'graalvm-community'
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build with Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Build native CLI
      run: ./gradlew :tooling:cli:nativeCompile

    - name: Package native CLI
      working-directory: tooling/cli/build/native/nativeCompile
      run: |
        mkdir -p "$GITHUB_WORKSPACE/dist"
        if [ -f parz.exe ]; then
          7z a "$GITHUB_WORKSPACE/dist/parz-${{ matrix.native }}.zip" parz.exe
        else
          tar -czf "$GITHUB_WORKSPACE/dist/parz-${{ matrix.native }}.tar.gz" parz
        fi

    - name: Upload native CLI
      uses: actions/upload-artifact@v5
      with:
        name: parz-${{ matrix.native }}
        path: dist/*
        if-no-files-found: error
